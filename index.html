<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corn工具庫</title>
    <style>
        /* 全域重設 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #1a1a1a; 
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* ---------------- 密碼鎖定畫面 (Lock View) ---------------- */
        #lockView {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .lock-box {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 215, 0, 0.3); 
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        .lock-box h2 {
            font-size: 22px;
            color: #ffd700;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .lock-box p {
            font-size: 13px;
            color: #cccccc;
            margin-bottom: 25px;
        }

        .password-container {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }

        .password-input {
            width: 100%;
            padding: 14px 45px 14px 14px; 
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            -webkit-text-security: disc;
        }

        .password-input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .eye-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            opacity: 0.6;
            user-select: none;
            transition: opacity 0.2s ease;
        }

        .eye-btn:hover { opacity: 1; }

        .unlock-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffd700, #ffa500);
            border: none;
            border-radius: 12px;
            color: #1a1a1a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .unlock-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
        }

        #errorMsg {
            color: #ff4d4d;
            font-size: 13px;
            margin-top: 12px;
            height: 18px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

        /* ---------------- 首頁視圖 (Home View) ---------------- */
        #homeView {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh; /* 確保全螢幕高度，避免手機瀏覽器網址列干擾 */
            padding: 20px;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .card-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 90vh; /* 卡片最大高度限制 */
            max-height: 850px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .card-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0.2) 30%, rgba(0, 0, 0, 0.7) 100%);
            display: flex;
            flex-direction: column;
            padding: 30px 15px 20px 15px; /* 內邊距調整 */
            z-index: 2;
        }

        /* 頂部標題區塊（固定不動） */
        .title-box {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 30px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 85%;
            margin: 0 auto 20px auto; /* 置中並與下方拉開距離 */
            flex-shrink: 0; /* 確保標題不會被壓縮 */
        }

        .title-box h1 {
            font-size: 22px;
            font-weight: 900;
            color: #ffd700;
            letter-spacing: 3px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        /* ---------------- 局部滑動按鈕區塊 (Scrollable Button Group) ---------------- */
        .button-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1; /* 自動填滿剩餘高度 */
            overflow-y: auto; /* 啟動垂直滑動 */
            padding-right: 5px; /* 預留捲軸空間，避免吃掉按鈕邊緣 */
            padding-bottom: 20px; /* 底部留白，滑到底才舒服 */
        }

        /* 智慧隱藏捲軸設計 (Webkit) */
        .button-group::-webkit-scrollbar {
            width: 4px; /* 極細捲軸 */
        }
        .button-group::-webkit-scrollbar-track {
            background: transparent; /* 軌道全透明 */
        }
        .button-group::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0); /* 預設完全透明 (隱藏) */
            border-radius: 10px;
            transition: background 0.3s ease;
        }
        /* 電腦版：滑鼠移入時或滑動時顯示金色半透明捲軸 */
        .button-group:hover::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.4);
        }
        /* 手機版原生會自動處理滑動顯示/停止隱藏的機制 */

        /* 按鈕樣式 */
        .menu-btn {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 16px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            flex-shrink: 0; /* 確保按鈕不會被擠壓變形 */
        }

        .menu-btn span {
            font-size: 11px;
            font-weight: normal;
            color: #dddddd;
            opacity: 0.8;
            letter-spacing: 0.5px;
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 215, 0, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.2);
            color: #ffd700;
        }
        
        .menu-btn:hover span {
            color: #ffffff;
            opacity: 1;
        }

        .menu-btn:active {
            transform: translateY(0);
        }

        /* ---------------- iframe 內嵌視圖 (Iframe View) ---------------- */
        #iframeView {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: column;
            align-items: center;
            padding: 0;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .iframe-header {
            width: 100%;
            height: 55px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            background-color: #222222;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .current-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 30px;
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.4);
            color: #ffd700;
        }

        .iframe-wrapper {
            width: 100%;
            flex: 1;
            background-color: #ffffff;
            border-radius: 0;
            border: none;
            box-shadow: none;
            overflow: hidden;
        }

        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }

        @media (max-height: 740px) {
            .card-container { max-width: 360px; height: 95vh; }
            .title-box { padding: 10px 20px; margin-bottom: 15px; }
            .title-box h1 { font-size: 19px; }
            .button-group { gap: 10px; }
            .menu-btn { padding: 12px 15px; font-size: 14.5px; }
            .menu-btn span { font-size: 10px; }
        }
    </style>
</head>
<body>

    <!-- 0. 密碼鎖定畫面 -->
    <div id="lockView">
        <div class="lock-box" id="lockBox">
            <h2>🔒 Corn 工具庫</h2>
            <p>請輸入操作密碼以繼續使用</p>
            <div class="password-container">
                <input type="text" id="passInput" class="password-input" placeholder="請輸入密碼" inputmode="text" onkeypress="handleKeyPress(event)">
                <span class="eye-btn" id="eyeBtn" onclick="togglePasswordVisibility()" title="顯示/隱藏密碼">👁️</span>
            </div>
            <button class="unlock-btn" onclick="checkPassword()">解鎖進入</button>
            <div id="errorMsg">密碼錯誤，請重試！</div>
        </div>
    </div>

    <!-- 1. 首頁主畫面 -->
    <div id="homeView">
        <div class="card-container">
            <img class="card-bg" src="1489065.jpg" alt="Corn工具庫背景圖">
            <div class="card-overlay">
                
                <!-- 標題區塊：固定不動 -->
                <div class="title-box">
                    <h1>Corn 工具庫</h1>
                </div>
                
                <!-- 按鈕區塊：加入 10 個按鈕並支援局部滑動 -->
                <div class="button-group">
                    <button class="menu-btn" onclick="openPage('routedraw.html', '路徑生產器')">
                        路徑生產器
                        <span>20260902更新重複讀取坐標</span>
                    </button>
                    
                    <button class="menu-btn" onclick="openPage('S2CellMap.html', 'S2網格掃盆')">
                        S2網格掃盆
                        <span>20260818新增路徑座標顯示</span>
                    </button>
                    
                    <button class="menu-btn" onclick="openPage('Flower-Farm-Coordinates-Library.html', '花田資料庫')">
                        花田座標存檔資料庫
                        <span>20260822存放花田座標資料</span>
                    </button>
                    
                    <button class="menu-btn" onclick="openPage('Coordinate-assignment.html', '座標分配繪製花田')">
                        座標分配繪製花田
                        <span>20260721更新分配區域可調排序及路徑下載</span>
                    </button>
                    
                    <button class="menu-btn" onclick="openPage('divide-the-work.html', '強開團分配')">
                        強開團分配
                        <span>20260825更新可以進行任務共享</span>
                    </button>
                    
                    <button class="menu-btn" onclick="openPage('map_gpx_pro.html', '座標分佈視覺化')">
                        多田座標分佈視覺化工具
                        <span>20260902更新重複讀取坐標</span>
                    </button>
                    
                    <button class="menu-btn" onclick="openPage('Bonsaidatabase.html', '掃盆座標資料庫')">
                        掃盆座標資料庫
                        <span>20260813上架</span>
                    </button>
                    
                    <button class="menu-btn" onclick="openPage('Time-Calculator.html', '蘑菇戰鬥時間計算')">
                        計算打菇完成時間
                        <span>20260722上架</span>
                    </button>
                    
                    <button class="menu-btn" onclick="openPage('pikmin-mushrooms.html', '菇點座標資料庫')">
                        菇點座標
                        <span>20260727上架</span>
                    </button>
                    
                    <button class="menu-btn" onclick="openPage('Referral-code.html', '刷邀請碼')">
                        快速複製邀請碼
                        <span>20260727上架</span>
                    </button>
                </div>
                
            </div>
        </div>
    </div>

    <!-- 2. iframe 分頁載入畫面 -->
    <div id="iframeView">
        <div class="iframe-header">
            <button class="back-btn" onclick="backToHome()">← 返回首頁</button>
            <div class="current-title" id="pageTitle">網頁名稱</div>
        </div>
        <div class="iframe-wrapper">
            <iframe id="contentFrame" src=""></iframe>
        </div>
    </div>

    <script>
        const lockView = document.getElementById('lockView');
        const homeView = document.getElementById('homeView');
        const iframeView = document.getElementById('iframeView');
        const contentFrame = document.getElementById('contentFrame');
        const pageTitle = document.getElementById('pageTitle');
        
        const passInput = document.getElementById('passInput');
        const errorMsg = document.getElementById('errorMsg');
        const lockBox = document.getElementById('lockBox');
        const eyeBtn = document.getElementById('eyeBtn');

        const CORRECT_PASS = "小小花農";

        window.onload = function() {
            if (sessionStorage.getItem("isUnlocked") === "true") {
                showHomeDirectly();
            } else {
                passInput.focus();
            }
        };

        function togglePasswordVisibility() {
            if (passInput.style.webkitTextSecurity === 'none') {
                passInput.style.webkitTextSecurity = 'disc';
                eyeBtn.style.opacity = '0.6';
            } else {
                passInput.style.webkitTextSecurity = 'none';
                eyeBtn.style.opacity = '1';
            }
            passInput.focus();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                checkPassword();
            }
        }

        function checkPassword() {
            if (passInput.value === CORRECT_PASS) {
                sessionStorage.setItem("isUnlocked", "true");
                
                lockView.style.opacity = '0';
                setTimeout(() => {
                    lockView.style.display = 'none';
                    homeView.style.display = 'flex';
                    homeView.offsetHeight; 
                    homeView.style.opacity = '1';
                }, 400);
            } else {
                errorMsg.style.opacity = '1';
                lockBox.classList.remove('shake');
                void lockBox.offsetWidth; 
                lockBox.classList.add('shake');
                
                passInput.value = '';
                passInput.focus();
            }
        }

        function showHomeDirectly() {
            lockView.style.display = 'none';
            homeView.style.display = 'flex';
            homeView.style.opacity = '1';
        }

        function openPage(url, title) {
            contentFrame.src = url;
            pageTitle.textContent = title;
            
            homeView.style.opacity = '0';
            setTimeout(() => {
                homeView.style.display = 'none';
                iframeView.style.display = 'flex';
                iframeView.offsetHeight; 
                iframeView.style.opacity = '1';
            }, 400);
        }

        function backToHome() {
            iframeView.style.opacity = '0';
            setTimeout(() => {
                iframeView.style.display = 'none';
                contentFrame.src = 'about:blank';
                
                homeView.style.display = 'flex';
                homeView.offsetHeight;
                homeView.style.opacity = '1';
            }, 400);
        }
    </script>

</body>
</html>
