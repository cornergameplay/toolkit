<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>強開團座標分配工具</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #4ade80; 
            --primary-hover: #22c55e;
            --accent: #60a5fa; 
            --danger: #f87171;
            --warning: #fbbf24;
            --custom: #c084fc;
            --bg-gradient: linear-gradient(135deg, #0b1120 0%, #171026 50%, #0d1b2a 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        /* 解決手機版面撐破的核心設定 */
        * { box-sizing: border-box; }
        html, body {
            max-width: 100vw;
            overflow-x: hidden; /* 嚴格禁止整個網頁出現橫向捲軸 */
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-gradient); 
            background-attachment: fixed;
            color: var(--text-main); 
            padding: 20px; 
            margin: 0; 
            min-height: 100vh;
        }
        
        .container { max-width: 1400px; margin: 0 auto; width: 100%; }
        
        h2 { text-align: center; margin: 0 0 20px 0; color: var(--primary); letter-spacing: 2px; text-shadow: 0 0 10px rgba(74, 222, 128, 0.3); }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            padding: 20px;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
            margin-bottom: 20px;
            align-items: start;
        }

        /* 強制右側面板不可超過自身網格的寬度 */
        .right-panel {
            min-width: 0; 
        }

        .admin-group { margin-bottom: 20px; }
        .admin-group:last-child { margin-bottom: 0; }

        label { font-size: 14px; font-weight: 600; color: var(--accent); display: block; margin-bottom: 8px; letter-spacing: 0.5px;}
        
        select, textarea, input[type="text"], input[type="password"] { 
            width: 100%; padding: 12px; border-radius: 8px; 
            border: 1px solid var(--glass-border); background: rgba(0, 0, 0, 0.3);
            color: var(--text-main); font-size: 14px; outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        select:focus, textarea:focus, input:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(74, 222, 128, 0.2); }
        select option { background: #1e1e2f; color: #fff; } 
        
        textarea { min-height: 100px; resize: none; margin-bottom: 5px; font-family: monospace; overflow: hidden; }

        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top:10px; }
        button { border: none; border-radius: 8px; cursor: pointer; font-weight: bold; padding: 12px; transition: all 0.2s ease; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        button:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); filter: brightness(1.1); }
        
        .btn-assign { flex: 2; background: var(--primary); color: #000; }
        .btn-copy-group { flex: 1.5; background: var(--warning); color: #000; }
        .btn-utility { flex: 1; background: rgba(255,255,255,0.1); color: var(--text-main); border: 1px solid var(--glass-border); }
        .btn-danger { background: var(--danger); color: white; width: 100%; margin-top: 10px; }
        .btn-share { background: var(--accent); color: #000; width: 100%; margin-top: 15px; font-size: 15px; }

        .save-options { 
            background: rgba(0, 0, 0, 0.2); padding: 12px; border-radius: 8px; 
            margin-bottom: 10px; font-size: 13px; color: var(--text-muted); border: 1px solid var(--glass-border);
        }
        .save-options label { color: var(--text-muted); font-size: 13px; margin-bottom: 6px; font-weight: normal; cursor: pointer;}
        
        /* 讓表格只在自己的框框內產生橫向捲軸，加上滑順觸控滾動 */
        .table-container { 
            width: 100%;
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch; 
        }
        table { width: 100%; border-collapse: collapse; min-width: 650px; }
        th { background: rgba(255, 255, 255, 0.05); color: var(--primary); padding: 14px 10px; text-align: left; border-bottom: 2px solid var(--glass-border); white-space: nowrap; }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        tr:hover td { background: rgba(255,255,255,0.03); }
        
        .check-col, .no-col { width: 40px; text-align: center; }
        .member-col { white-space: nowrap; width: 1%; min-width: 130px; }
        .assigned-name { font-weight: bold; color: #000; padding: 4px 14px; border-radius: 6px; font-size: 13px; display:inline-block; }
        
        /* 複製按鈕樣式 */
        .copy-btn { background: rgba(255,255,255,0.1); color: var(--text-main); padding: 6px 12px; border-radius: 6px; font-size: 12px; border: 1px solid var(--glass-border); white-space: nowrap; }
        .copy-btn.copied { background: var(--primary); color: #000; border-color: var(--primary); }

        #collabHeader { display: none; background: rgba(251, 191, 36, 0.1); border: 1px solid var(--warning); text-align: center; }
        .history-box { font-size: 12px; color: var(--text-muted); background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px; height: 60px; overflow-y: auto; text-align: left; margin-top: 10px; border: 1px solid var(--glass-border); }
        
        #map { height: 500px; width: 100%; border-radius: 12px; z-index: 1; margin-top: 10px;}
        .map-number-icon { color: #000; border-radius: 50%; width: 24px; height: 24px; line-height: 24px; text-align: center; font-size: 12px; font-weight: bold; box-shadow: 0 0 10px rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.8); }

        /* 手機版響應式滿版 */
        @media (max-width: 950px) { 
            body { padding: 10px; }
            .layout-grid { grid-template-columns: 1fr; gap: 10px; } 
            .glass-panel { padding: 15px; }
            .table-container { margin-top: 0; }
        }
    </style>
</head>
<body>
<div class="container">
    <h2>強開團座標分配工具</h2>
    
    <div id="collabHeader" class="glass-panel" style="margin-bottom: 20px;">
        <h3 style="margin:0 0 5px 0; color:var(--warning);">🔗 共享任務模式 (代碼：<span id="displayCode"></span>)</h3>
        <div id="expireTimeDisplay" style="font-size: 13px; color: var(--danger); margin-bottom: 12px;"></div>
        <div id="collabActions">
            <button id="btnUnlock" onclick="unlockTask()" class="btn-danger" style="width: auto; padding: 10px 25px; margin-top:0;">🔒 輸入密碼解鎖編輯</button>
            <button id="btnSaveSync" onclick="saveSharedTask()" style="display:none; background:var(--primary); color:#000; padding:10px 25px;">💾 儲存變更並同步</button>
        </div>
        <div class="history-box" id="historyLog">讀取中...</div>
    </div>

    <div class="layout-grid">
        <div class="left-panel">
            <div class="glass-panel admin-group" id="section1">
                <label id="dbStatusLabel">📍 1. 選擇花田 (連線中...)</label>
                <select id="fieldSelector" onchange="resetAndRender()"></select>
                <div class="btn-group" style="margin-top:15px;">
                    <button class="btn-utility" onclick="toggleAllChecks(true)">全選座標</button>
                    <button class="btn-utility" onclick="toggleAllChecks(false)">取消全選</button>
                </div>
            </div>

            <div class="glass-panel admin-group" id="section2">
                <label>👥 2. 分配名單 (數量 名稱)</label>
                <textarea id="batchMemberInput" placeholder="5 小明&#10;10 阿華" oninput="updateStats()"></textarea>
                <div id="statsDisplay" style="font-size:13px; margin-top:5px; color:var(--text-muted);">需求: 0 | 可用: 0</div>
                <div class="btn-group">
                    <button class="btn-assign" id="btnAssignAction" onclick="autoAssign()">循序自動分配</button>
                    <button class="btn-copy-group" id="btnCopyFormat" onclick="copyForGroup(this)">複製轉貼格式</button>
                </div>
                <button class="btn-share" id="btnShare" onclick="shareDistribution()">📤 產生專屬網址並分享</button>
            </div>

            <div class="glass-panel admin-group" id="section3">
                <label>📝 3. 臨時增加座標 (GPX / 手動)</label>
                <input type="file" id="gpxFile" accept=".gpx" style="display:none;" onchange="importGPX(this)">
                <button class="btn-utility" onclick="document.getElementById('gpxFile').click()" style="width:100%; margin-bottom:12px; background: rgba(96, 165, 250, 0.2); border-color: var(--accent); color:var(--accent);">📂 載入 GPX 檔案</button>
                <textarea id="customCoordsInput" placeholder="緯度, 經度 (一行一個)"></textarea>
                <div class="save-options">
                    <div style="font-weight:bold; color:var(--text-main); margin-bottom:8px; border-bottom:1px solid var(--glass-border); padding-bottom:5px;">儲存模式：</div>
                    <label><input type="radio" name="saveMode" value="local" checked onchange="togglePwd()"> 僅本次網頁暫存</label><br>
                    <label><input type="radio" name="saveMode" value="temp" onchange="togglePwd()"> ☁️ 雲端暫存 (30 小時)</label><br>
                    <label><input type="radio" name="saveMode" value="perm" onchange="togglePwd()"> ☁️ 永久儲存 (需密碼)</label>
                    <input type="password" id="permPwd" placeholder="請輸入密碼 (1234)" style="display:none; margin-top:8px;">
                </div>
                <button onclick="loadCustomCoords()" style="background:var(--custom); color:#fff; width:100%;">載入並處理座標</button>
            </div>
        </div>

        <div class="right-panel glass-panel" id="tableWrapper">
            <div class="table-container">
                <table id="coordTable">
                    <thead>
                        <tr>
                            <th class="check-col">分配?</th>
                            <th class="no-col">#</th>
                            <th width="70">動作</th>
                            <th class="member-col">分配成員</th>
                            <th>座標位置</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div> 

    <div id="map" class="glass-panel" style="padding:5px;"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

        "美國傑克遜維爾佛羅里達42": ["30.387669,-81.405249", "30.388264,-81.403962", "30.392678,-81.404505", "30.389852,-81.402799", "30.390817,-81.402464", "30.392075,-81.402294", "30.390058,-81.401297", "30.388973,-81.400518", "30.387576,-81.401259", "30.387878,-81.39878", "30.388352,-81.39943", "30.390399,-81.399413", "30.393208,-81.396911", "30.392332,-81.396805", "30.391654,-81.395593", "30.390796,-81.395979", "30.389525,-81.396605", "30.389397,-81.395922", "30.388111,-81.396604", "30.387895,-81.395964", "30.38773,-81.396699", "30.386448,-81.396866", "30.383904,-81.397437", "30.382479,-81.39692", "30.382,-81.397229", "30.383237,-81.398276", "30.383037,-81.399239", "30.382551,-81.400216", "30.381866,-81.400611", "30.379343,-81.399531", "30.377492,-81.40049", "30.376401,-81.404344", "30.375567,-81.407235", "30.37825,-81.404697", "30.378604,-81.404809", "30.378567,-81.404145", "30.379516,-81.402085", "30.37958,-81.401418", "30.381902,-81.404395", "30.383115,-81.404865", "30.383813,-81.406048", "30.383803,-81.40347"],
        "南韓首爾26": ["37.53227,126.981554", "37.531552,126.98111", "37.531535,126.980733", "37.532098,126.980486", "37.533717,126.981542", "37.536018,126.981034", "37.536217,126.980843", "37.537379,126.979907", "37.537883,126.978551", "37.53647,126.9822", "37.536667,126.982867", "37.537617,126.982901", "37.538436,126.982983", "37.540355,126.98417", "37.538049,126.985284", "37.536362,126.984716", "37.536087,126.984725", "37.535586,126.985092", "37.532243,126.983183", "37.528693,126.98581", "37.525965,126.98486", "37.526428,126.982961", "37.526385,126.981586", "37.525732,126.980151", "37.526553,126.979889", "37.528385,126.981007"],
        "古巴17": ["19.92477,-75.1352", "19.925928,-75.136141", "19.925776,-75.137389", "19.924466,-75.13819", "19.924013,-75.136755", "19.921146,-75.137189", "19.919939,-75.136233", "19.921085,-75.134491", "19.91961,-75.132254", "19.918642,-75.134809", "19.916379,-75.133743", "19.916995,-75.135785", "19.918439,-75.136325", "19.918,-75.137603", "19.918967,-75.13951", "19.917198,-75.138295", "19.915664,-75.139625"],
        "美國阿靈頓19": ["38.876943,-77.078173", "38.877741,-77.078565", "38.878167,-77.080036", "38.876745,-77.080308", "38.875947,-77.082051", "38.879833,-77.080755", "38.879743,-77.082073", "38.880578,-77.078915", "38.880783,-77.07974", "38.881146,-77.081139", "38.881893,-77.08312", "38.881581,-77.084057", "38.88247,-77.083835", "38.884024,-77.083434", "38.885463,-77.082064", "38.884147,-77.08109", "38.884291,-77.079704", "38.885288,-77.07814", "38.884434,-77.077864"],
        "日本福生24": ["35.745167,139.34205", "35.745041,139.340578", "35.744407,139.339785", "35.744318,139.34101", "35.744395,139.342448", "35.743012,139.339143", "35.742978,139.34143", "35.742133,139.340475", "35.741617,139.341011", "35.74094,139.340946", "35.742625,139.343556", "35.742547,139.34434", "35.740053,139.341648", "35.738599,139.340096", "35.737132,139.340718", "35.737774,139.341109", "35.738459,139.342224", "35.737755,139.34314", "35.737515,139.34465", "35.737336,139.346845", "35.735833,139.344333", "35.734962,139.344647", "35.740183,139.344742", "35.739723,139.345764"]
    };

    let database = {}, dbExpireTimes = {}; 
    let localOnlyKeys = new Set(); 
    let currentAssignMap = {}, memberColorMap = {}; 
    let map, markersLayer = L.layerGroup(), lastGpxName = "臨時區域";
    let isCollabMode = false, collabCode = "", collabRequiresPassword = false, collabPassword = "", collabData = {};
    let isUIReadOnly = false; 
    
    const colorPalette = ['#4ade80', '#60a5fa', '#f472b6', '#c084fc', '#fbbf24', '#38bdf8', '#fb7185', '#a7f3d0', '#fef08a', '#e879f9'];

    async function init() {
        map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);
        markersLayer.addTo(map);

        const urlParams = new URLSearchParams(window.location.search);
        collabCode = urlParams.get('code');

        if (collabCode) {
            isCollabMode = true;
            document.getElementById('collabHeader').style.display = 'block';
            document.getElementById('displayCode').innerText = collabCode;
            document.getElementById('section1').style.display = 'none';
            document.getElementById('section3').style.display = 'none';
            document.getElementById('btnShare').style.display = 'none';
            await loadSharedTask(collabCode);
        } else {
            await loadNormalDatabase();
        }

        // 當視窗改變大小時，通知 Leaflet 地圖重新計算寬度，確保滿版
        window.addEventListener('resize', () => {
            if(map) map.invalidateSize();
        });
    }

    async function safeFetch(url, options = {}) {
        let fetchOptions = { ...options, redirect: 'follow' };
        if (options.method === 'POST') {
            fetchOptions.headers = { "Content-Type": "text/plain;charset=utf-8" };
        }
        return await fetch(url, fetchOptions);
    }

    // --- 協作模式邏輯 ---
    async function loadSharedTask(code) {
        setUIRestriction(true); 
        try {
            let res = await safeFetch(`${GAS_URL}?action=getTask&code=${code}`, { method: 'GET' });
            let text = await res.text();
            let json;
            try { json = JSON.parse(text); } catch(err) {
                console.error("解析失敗，回傳內容：", text);
                return alert("⚠️ 系統錯誤：後端回傳格式異常，詳見 F12 Console。");
            }
            
            if (json.status === "success") {
                collabData = json.data;
                database[collabData.fieldName] = collabData.coords;
                currentAssignMap = collabData.assignMap || {};
                memberColorMap = collabData.colorMap || {};
                collabRequiresPassword = json.hasPassword; 
                
                if (json.expireTime) {
                    let d = new Date(json.expireTime);
                    let dateStr = `${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
                    document.getElementById('expireTimeDisplay').innerText = `此頁面於 ${dateStr} 失效`;
                }

                let sel = document.getElementById('fieldSelector');
                sel.innerHTML = `<option value="${collabData.fieldName}">${collabData.fieldName}</option>`;
                document.getElementById('batchMemberInput').value = collabData.memberInput || "";
                renderHistory(json.history);
                
                if (collabRequiresPassword) {
                    alert("此任務受密碼保護，目前為唯讀模式 (可正常複製)。");
                } else {
                    document.getElementById('btnUnlock').style.display = 'none';
                    document.getElementById('btnSaveSync').style.display = 'inline-block';
                    setUIRestriction(false); 
                }
                
                renderTable(collabData.checkedStates);
                updateStats();
            } else { alert("❌ 任務不存在或已過期！"); }
        } catch(e) { console.error(e); alert("連線錯誤或權限不足"); }
    }

    function setUIRestriction(locked) {
        isUIReadOnly = locked;
        document.getElementById('batchMemberInput').disabled = locked;
        document.getElementById('btnAssignAction').disabled = locked;
        if(document.getElementById('fieldSelector').value) renderTable(null, true);
    }

    function unlockTask() {
        let pwd = prompt("請輸入任務解鎖密碼：");
        if (pwd) {
            collabPassword = pwd;
            setUIRestriction(false);
            document.getElementById('btnUnlock').style.display = 'none';
            document.getElementById('btnSaveSync').style.display = 'inline-block';
            alert("🔓 已解鎖！您可以開始修改分配與勾選狀態。");
        }
    }

    async function saveSharedTask() {
        let nickname = prompt("請輸入您的暱稱 (必填，將記錄在歷程中)：");
        if (!nickname) return alert("必須輸入暱稱才能儲存變更！");

        if (collabRequiresPassword) {
            let pwd = prompt("請輸入修改密碼：");
            if (pwd === null) return; 
            collabPassword = pwd;
        }

        const fieldName = document.getElementById('fieldSelector').value;
        const checks = Array.from(document.querySelectorAll('.row-check')).map(c => c.checked);
        
        const payload = {
            action: "updateTask", code: collabCode, password: collabPassword, nickname: nickname,
            data: { fieldName: fieldName, coords: database[fieldName], memberInput: document.getElementById('batchMemberInput').value, assignMap: currentAssignMap, colorMap: memberColorMap, checkedStates: checks }
        };

        try {
            document.getElementById('btnSaveSync').innerText = "☁️ 儲存中...";
            let res = await safeFetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
            let text = await res.text();
            let json;
            try { json = JSON.parse(text); } catch(err) {
                console.error("解析失敗，回傳內容：", text);
                document.getElementById('btnSaveSync').innerText = "💾 儲存變更並同步";
                return alert("⚠️ 系統錯誤：後端回傳格式異常，詳見 F12 Console。");
            }
            
            if (json.status === "success") {
                renderHistory(json.history);
                alert("✅ 變更已成功同步至雲端！");
            } else { alert("❌ 儲存失敗：" + json.message); }
        } catch(e) { console.error(e); alert("連線失敗"); }
        finally { document.getElementById('btnSaveSync').innerText = "💾 儲存變更並同步"; }
    }

    async function shareDistribution() {
        const fieldName = document.getElementById('fieldSelector').value;
        if (!fieldName || Object.keys(currentAssignMap).length === 0) return alert("請先選擇花田並進行分配後再分享！");
        
        let nickname = prompt("請輸入您的暱稱 (建立者)：");
        if (!nickname) return;
        
        let pwd = prompt("請設定修改密碼 (若留空則任何人皆可直接編輯，但均能自由複製)：");
        let newCode = Math.floor(100000 + Math.random() * 900000).toString();
        const checks = Array.from(document.querySelectorAll('.row-check')).map(c => c.checked);

        const payload = {
            action: "shareTask", code: newCode, password: pwd || "", nickname: nickname,
            data: { fieldName: fieldName, coords: database[fieldName], memberInput: document.getElementById('batchMemberInput').value, assignMap: currentAssignMap, colorMap: memberColorMap, checkedStates: checks }
        };

        try {
            document.getElementById('btnShare').innerText = "☁️ 產生連結中...";
            let res = await safeFetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
            let text = await res.text();
            let json;
            try { json = JSON.parse(text); } catch(err) {
                console.error("解析失敗，回傳內容：", text);
                document.getElementById('btnShare').innerText = "📤 產生專屬網址並分享";
                return alert("⚠️ 系統錯誤：後端回傳格式異常，詳見 F12 Console。");
            }
            
            if (json.status === "success") { window.location.href = window.location.pathname + "?code=" + newCode; } 
            else { alert("發生錯誤"); }
        } catch(e) { console.error(e); alert("連線錯誤"); document.getElementById('btnShare').innerText = "📤 產生專屬網址並分享"; }
    }

    function renderHistory(historyArray) {
        const box = document.getElementById('historyLog');
        box.innerHTML = historyArray.slice().reverse().map(h => `<div>${h}</div>`).join('');
    }

    async function loadNormalDatabase() {
        database = Object.assign({}, defaultDatabase);
        try {
            let res = await safeFetch(GAS_URL, { method: 'GET' });
            let text = await res.text();
            let cloudData;
            try {
                cloudData = JSON.parse(text);
            } catch (err) {
                console.error("解析失敗，後端回傳內容為：\n", text);
                document.getElementById('dbStatusLabel').innerText = "📍 1. 選擇花田 (⚠️解析錯誤，請看F12)";
                populateSelector();
                return;
            }

            for(let key in cloudData) {
                database[key] = cloudData[key].coords;
                dbExpireTimes[key] = cloudData[key].expireTime;
            }
            document.getElementById('dbStatusLabel').innerText = "📍 1. 選擇花田 (☁️雲端同步成功)";
        } catch(e) { 
            console.error("網路連線錯誤：", e);
            document.getElementById('dbStatusLabel').innerText = "📍 1. 選擇花田 (⚠️無法連線雲端，僅預設)"; 
        }
        populateSelector();
    }

    function populateSelector() {
        let sel = document.getElementById('fieldSelector');
        let currentVal = sel.value;
        sel.innerHTML = "";
        let now = new Date().getTime();

        for (let name in database) {
            let suffix = "";
            if (localOnlyKeys.has(name)) {
                suffix = " (僅本次暫存)";
            } else if (dbExpireTimes[name] && dbExpireTimes[name] > now) {
                let diffMs = dbExpireTimes[name] - now;
                let hrs = Math.floor(diffMs / (1000 * 60 * 60));
                let mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                suffix = ` (剩餘${hrs}小時${mins}分鐘)`;
            }
            sel.innerHTML += `<option value="${name}">${name}${suffix}</option>`;
        }
        if(database[currentVal]) sel.value = currentVal;
        if(Object.keys(database).length > 0) resetAndRender();
    }

    async function loadCustomCoords() {
        const lines = document.getElementById('customCoordsInput').value.split('\n').map(l => l.trim()).filter(l => l.length > 5);
        if (lines.length === 0) return alert("請輸入或載入座標");
        
        let customName = prompt("請為這個區域命名：", lastGpxName);
        if(!customName) return;

        const mode = document.querySelector('input[name="saveMode"]:checked').value;
        const pwd = document.getElementById('permPwd').value;
        if (mode === 'perm' && pwd !== "1234") return alert("❌ 密碼錯誤！");

        database[customName] = lines;
        
        if (mode === 'local') {
            localOnlyKeys.add(customName);
            alert(`✅ 成功載入 ${lines.length} 個座標於本地網頁`);
            populateSelector();
            document.getElementById('fieldSelector').value = customName;
            resetAndRender();
        } else {
            try {
                let payload = { action: "save", name: customName, coords: lines, type: mode, password: pwd };
                let res = await safeFetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                let text = await res.text();
                let result;
                try { result = JSON.parse(text); } catch (err) {
                    console.error("解析失敗，回傳內容：", text);
                    localOnlyKeys.add(customName);
                    populateSelector();
                    document.getElementById('fieldSelector').value = customName;
                    resetAndRender();
                    return alert("⚠️ 雲端儲存失敗：後端回傳格式異常，已改為本地暫存 (詳見F12)");
                }
                
                if (result.status === "success") {
                    if (mode === 'temp') dbExpireTimes[customName] = new Date().getTime() + (30 * 60 * 60 * 1000);
                    alert(`✅ 成功上傳至雲端！\n模式：${mode === 'perm' ? '永久' : '30小時暫存'}`);
                } else { 
                    alert(`❌ 雲端儲存失敗：${result.message}`);
                    localOnlyKeys.add(customName); 
                }
            } catch(e) { 
                console.error(e);
                alert("❌ 連線失敗！已在本地端暫存。"); 
                localOnlyKeys.add(customName);
            }
            populateSelector();
            document.getElementById('fieldSelector').value = customName;
            resetAndRender();
        }
    }

    function copyC(t, btn) { 
        navigator.clipboard.writeText(t.replace(/\s/g, "")); 
        if (btn) {
            btn.innerText = "已複製";
            btn.classList.add("copied");
        }
    }

    function copyForGroup(btn) {
        const n = document.getElementById('fieldSelector').value, c = database[n], g = {}, u = [], chk = document.querySelectorAll('.row-check'), order = [];
        const assignedIndices = Object.keys(currentAssignMap).sort((a,b) => {
             const names = document.getElementById('batchMemberInput').value.split('\n').map(l => l.trim().split(/\s+/)[1]);
             return names.indexOf(currentAssignMap[a]) - names.indexOf(currentAssignMap[b]);
        });
        assignedIndices.forEach(idx => {
            const m = currentAssignMap[idx], cl = c[idx].replace(/\s/g, "");
            if (!g[m]) { g[m] = []; order.push(m); } g[m].push(cl);
        });
        c.forEach((v, i) => { if (chk[i].checked && !currentAssignMap[i]) u.push(v.replace(/\s/g, "")); });
        let res = `📍 ${n} 分配名單\n\n`;
        order.forEach(nm => res += `+${g[nm].length} ${nm}\n${g[nm].join('\n')}\n\n`);
        if (u.length > 0) res += `未分配座標(可依序認領)\n${u.join('\n')}`;
        
        navigator.clipboard.writeText(res.trim()).then(() => {
            if (btn) {
                btn.innerText = "已複製格式";
                btn.classList.add("copied");
            }
        });
    }

    function autoAssign() {
        updateStats();
        const checks = document.querySelectorAll('.row-check');
        let pool = []; checks.forEach((c, i) => { if (c.checked) pool.push(i); });
        
        let reqs = [];
        document.getElementById('batchMemberInput').value.split('\n').forEach(l => {
            const p = l.trim().split(/\s+/); 
            if (p.length >= 2) reqs.push({ count: parseInt(p[0]), name: p.slice(1).join(' ') });
        });

        currentAssignMap = {}; memberColorMap = {}; 
        let colorIdx = 0, poolPointer = 0;

        reqs.forEach(r => {
            if (!memberColorMap[r.name]) memberColorMap[r.name] = colorPalette[colorIdx++ % colorPalette.length];
            for (let k = 0; k < r.count; k++) { 
                if (poolPointer < pool.length) { currentAssignMap[pool[poolPointer]] = r.name; poolPointer++; }
            }
        });
        
        const copyFmtBtn = document.getElementById('btnCopyFormat');
        if(copyFmtBtn) { copyFmtBtn.innerText = "複製轉貼格式"; copyFmtBtn.classList.remove("copied"); }

        renderTable(); 
    }

    function renderTable(forcedChecks = null, keepCurrentChecks = false) {
        if(!document.getElementById('fieldSelector').value) return;
        
        let prev = keepCurrentChecks ? Array.from(document.querySelectorAll('.row-check')).map(c => c.checked) : (forcedChecks || Array.from(document.querySelectorAll('.row-check')).map(c => c.checked));
        
        const coords = database[document.getElementById('fieldSelector').value];
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = ""; markersLayer.clearLayers(); let bounds = [];

        coords.forEach((coord, i) => {
            const isChecked = (prev.length === 0) ? true : (prev[i] !== undefined ? prev[i] : true);
            const mName = currentAssignMap[i], [lat, lng] = coord.split(',').map(Number);
            if (!isNaN(lat)) bounds.push([lat, lng]);

            const tr = document.createElement('tr');
            if (!isChecked) tr.className = "row-disabled";
            let color = isChecked ? (mName ? memberColorMap[mName] : 'rgba(255,255,255,0.2)') : 'rgba(255,255,255,0.05)';

            tr.innerHTML = `
                <td class="check-col"><input type="checkbox" class="row-check" ${isChecked ? 'checked' : ''} ${isUIReadOnly ? 'disabled' : ''} onchange="renderTable(); updateStats();"></td>
                <td class="no-col">${i + 1}</td>
                <td><button class="copy-btn" onclick="copyC('${coord}', this)">複製</button></td>
                <td class="member-col">${mName ? `<span class="assigned-name" style="background:${color}">${mName}</span>` : `<span style="color:var(--text-muted);font-size:12px;">未分配</span>`}</td>
                <td style="font-family:monospace;font-size:12px;color:var(--accent);">${coord}</td>
            `;
            tbody.appendChild(tr);
            L.marker([lat, lng], {icon: L.divIcon({className: '', html: `<div class="map-number-icon" style="background:${color}">${i + 1}</div>`, iconSize: [24, 24]})}).addTo(markersLayer);
        });
        if (bounds.length > 0) {
            map.fitBounds(bounds, {padding: [50, 50]});
            setTimeout(() => map.invalidateSize(), 300); // 確保 Leaflet 完全重算一次
        }
    }

    function updateStats() {
        const ta = document.getElementById('batchMemberInput');
        ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight) + 'px';
        let d = 0; ta.value.split('\n').forEach(l => { const c = parseInt(l.trim().split(/\s+/)[0]); if (!isNaN(c)) d += c; });
        const a = Array.from(document.querySelectorAll('.row-check')).filter(c => c.checked).length;
        document.getElementById('statsDisplay').innerHTML = `總需求: <b>${d}</b> | 可用座標: <b>${a}</b>`;
        return { demand: d, available: a };
    }

    function resetAndRender() { 
        currentAssignMap = {}; memberColorMap = {}; 
        const copyFmtBtn = document.getElementById('btnCopyFormat');
        if(copyFmtBtn) { copyFmtBtn.innerText = "複製轉貼格式"; copyFmtBtn.classList.remove("copied"); }
        renderTable(); updateStats(); 
    }
    
    function toggleAllChecks(s) { if(isUIReadOnly) return; document.querySelectorAll('.row-check').forEach(c => c.checked = s); renderTable(); updateStats(); }
    function togglePwd() { document.getElementById('permPwd').style.display = (document.querySelector('input[name="saveMode"]:checked').value === 'perm') ? 'block' : 'none'; }
    
    function importGPX(i) {
        const f = i.files[0]; if (!f) return;
        lastGpxName = f.name.replace(/\.[^/.]+$/, "");
        const reader = new FileReader();
        reader.onload = e => {
            const xml = new DOMParser().parseFromString(e.target.result, "text/xml");
            const pts = xml.querySelectorAll('wpt, trkpt');
            let found = []; pts.forEach(p => {
                const lat = p.getAttribute('lat'), lon = p.getAttribute('lon');
                if (lat && lon) found.push(`${lat},${lon}`);
            });
            if (found.length > 0) document.getElementById('customCoordsInput').value = found.join('\n'); 
        }; reader.readAsText(f);
    }
    window.onload = init;
</script>
</body>
