<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 花田座標編輯分配工具</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* 
         * 🌸 自然與生活風配色方案 
         * 主色: #FDFBF7 (燕麥奶白)
         * 輔助色: #E6F0EA (鼠尾草綠), #D2B48C (淺駝色)
         * 強調色: #E6A15C (向日葵黃), #2E5A44 (森林深綠)
         */

        body { font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; background-color: #FDFBF7; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; }
        .card { background: #FFFFFF; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(46,90,68,0.06); margin-bottom: 20px; border: 1px solid #E6F0EA; }
        h1 { color: #2E5A44; margin-top: 0; font-size: 1.8rem; }
        h2 { font-size: 1.1rem; color: #2E5A44; border-bottom: 2px solid #E6F0EA; padding-bottom: 8px; margin-top: 0; }
        
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; margin-bottom: 20px; }
        
        /* 拖曳與輸入區 */
        .drop-zone { border: 2px dashed #D2B48C; border-radius: 8px; background-color: #FDFBF7; cursor: pointer; transition: 0.3s; height: 85px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-sizing: border-box; }
        .drop-zone:hover, .drop-zone.dragover { border-color: #2E5A44; background-color: #E6F0EA; }
        .drop-zone p { margin: 3px 0; }
        .manual-input { width: 100%; height: 85px; resize: none; border: 1px solid #D2B48C; border-radius: 6px; padding: 8px; box-sizing: border-box; font-family: monospace; background-color: #FDFBF7; color: #333; }
        .manual-input:focus { border-color: #2E5A44; outline: none; box-shadow: 0 0 5px rgba(46,90,68,0.2); }
        
        .row { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-end; }
        .form-group { flex: 1; }
        label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: bold; color: #555; }
        input[type="number"], input[type="text"] { width: 100%; padding: 8px; border: 1px solid #D2B48C; border-radius: 4px; box-sizing: border-box; color: #333; }
        input:focus { border-color: #2E5A44; outline: none; }
        
        /* 按鈕全域樣式 */
        button { background: #2E5A44; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s; width: 100%; box-sizing: border-box; }
        button:hover { background: #1c3b2c; }
        button.outline-btn { background: transparent; color: #2E5A44; border: 1px solid #2E5A44; }
        button.outline-btn:hover { background: #E6F0EA; }
        
        /* 特殊按鈕 */
        button.dl-btn { background: #E6A15C; color: #2E5A44; font-size: 16px; padding: 12px; box-shadow: 0 2px 6px rgba(230,161,92,0.3); }
        button.dl-btn:hover { background: #d99047; }
        button.add-area-btn { background: #E6A15C; color: #2E5A44; width: auto; padding: 8px 20px; font-size: 15px; box-shadow: 0 2px 6px rgba(230,161,92,0.3); }
        button.add-area-btn:hover { background: #d99047; }
        button.import-btn { margin-top: 10px; padding: 8px; }
        
        /* 縮小並弱化全局重分配按鈕 */
        button.action-btn { background: #fff; color: #d35400; border: 1px solid #d35400; font-size: 13px; padding: 6px 12px; width: auto; margin-top: 5px; border-radius: 4px; } 
        button.action-btn:hover { background: #fceceb; }

        #map { height: 500px; width: 100%; border-radius: 8px; border: 1px solid #D2B48C; z-index: 1; margin-top: 10px; }
        .popup-select { width: 100%; padding: 4px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; }

        .batch-controls { background: #E6F0EA; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border: 1px solid #D2B48C; flex-wrap: wrap; gap: 10px; }
        .list-header-bar { display: flex; justify-content: space-between; align-items: center; margin: 25px 0 15px 0; border-bottom: 2px solid #D2B48C; padding-bottom: 10px; }
        
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 15px; }
        .cluster-card { background: #fff; border-top: 5px solid; padding: 12px; border-radius: 8px; box-shadow: 0 2px 10px rgba(46,90,68,0.05); position: relative; display: flex; flex-direction: column; border-left: 1px solid #E6F0EA; border-right: 1px solid #E6F0EA; border-bottom: 1px solid #E6F0EA; }
        .cluster-card textarea { width: 100%; height: 90px; font-family: monospace; font-size: 12px; padding: 6px; border: 1px solid #D2B48C; resize: none; background: #FDFBF7; box-sizing: border-box; margin-top: 8px; border-radius: 4px; color: #555; }
        .cluster-card textarea:focus { border-color: #2E5A44; outline: none; box-shadow: 0 0 5px rgba(46,90,68,0.2); }
        
        .card-header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
        .card-title-input { flex: 1; border: 1px solid transparent; border-bottom: 1px dashed #D2B48C; font-size: 15px; font-weight: bold; padding: 2px 4px; background: transparent; color: inherit; transition: 0.2s; width: 100%; }
        .card-title-input:focus { border-color: #2E5A44; background: #fff; outline: none; }
        .badge { background: #FDFBF7; border: 1px solid #D2B48C; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; color: #2E5A44; white-space: nowrap; }
        .card-gray { border-top-color: #bdc3c7 !important; opacity: 0.9; }
        
        .stats-badge { background: #FDFBF7; border: 1px solid #D2B48C; padding: 6px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; color: #2E5A44; display: inline-block; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: #FDFBF7; width: 90%; max-width: 650px; border-radius: 12px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-height: 80vh; display: flex; flex-direction: column; border: 2px solid #E6F0EA; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #D2B48C; padding-bottom: 10px; margin-bottom: 15px; }
        .modal-body { overflow-y: auto; flex: 1; padding-right: 5px; }
        .modal-footer { border-top: 1px solid #D2B48C; padding-top: 15px; margin-top: 15px; display: flex; justify-content: flex-end; gap: 10px; }
        
        .import-option { border: 1px solid #D2B48C; background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .import-option:hover { border-color: #2E5A44; background: #E6F0EA; }
        .import-option label { font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: #333; margin: 0; }
        .import-sub-box { margin-left: 28px; margin-top: 10px; padding-left: 15px; border-left: 3px solid #2E5A44; display: none; }
        
        .export-table { width: 100%; border-collapse: collapse; text-align: left; }
        .export-table th, .export-table td { padding: 8px; border-bottom: 1px solid #E6F0EA; }
        .export-table input[type="text"] { width: 100%; border: 1px solid #D2B48C; font-size: 14px; padding: 6px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌸 花田座標編輯分配工具</h1>

    <div class="grid-layout">
        <!-- 區塊 1 -->
        <div class="card" style="margin-bottom: 0;">
            <h2>1. 載入 GPX / CSV / TXT</h2>
            <div class="drop-zone" id="dropZone">
                <p style="font-size: 20px; margin: 0;">📂</p>
                <p style="font-size: 13px; color:#555;">拖曳檔案至此或 <span style="color:#2E5A44; font-weight:bold;">點擊選擇</span></p>
            </div>
            <input type="file" id="fileInput" accept=".gpx,.csv,.txt" multiple style="display: none;">
        </div>

        <!-- 區塊 2 -->
        <div class="card" style="margin-bottom: 0;">
            <h2>2. 手動貼上座標 (每行一筆)</h2>
            <textarea id="manualInput" class="manual-input" placeholder="例如：23.5123, 121.1234"></textarea>
            <button class="import-btn" onclick="processManualPoints()">➕ 匯入這些座標</button>
        </div>

        <!-- 區塊 3 -->
        <div class="card" style="margin-bottom: 0;">
            <h2>3. AI 全局重分配</h2>
            <div class="row">
                <div class="form-group"><label>下限：</label><input type="number" id="minSize" value="10" min="1"></div>
                <div class="form-group"><label>上限：</label><input type="number" id="maxSize" value="20" min="1"></div>
            </div>
            <div style="text-align: right;">
                <button class="action-btn" onclick="startConstrainedKMeansGlobal()" title="會打散目前所有的區域">⚠️ 覆蓋並打散重配</button>
            </div>
        </div>
    </div>

    <!-- 地圖預覽 -->
    <div class="card" style="padding: 15px;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <h2 style="margin: 0; border: none; padding: 0;">🗺️ 地圖預覽與調度</h2>
            <div class="stats-badge">
                📍 系統總計：<span id="totalPointsCount" style="color:#d35400; font-size:16px;">0</span> 點 / <span id="totalClustersCount" style="color:#2E5A44; font-size:16px;">0</span> 區
            </div>
        </div>
        <div id="map"></div>
    </div>

    <!-- 批次下載控制台 -->
    <div class="batch-controls">
        <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
            <button class="outline-btn" style="width: auto; padding: 6px 12px; background: #fff;" onclick="toggleAllCheckboxes(true)">☑️ 全選</button>
            <button class="outline-btn" style="width: auto; padding: 6px 12px; background: #fff;" onclick="toggleAllCheckboxes(false)">☐ 全不選</button>
            <div style="display: flex; align-items: center; gap: 5px;">
                <span style="font-size: 14px; font-weight: bold; color: #2E5A44;">匯出格式：</span>
                <select id="exportFormat" style="padding: 6px; border-radius: 4px; border: 1px solid #D2B48C; font-size: 14px;">
                    <option value="gpx">GPX 航點 (.wpt)</option>
                    <option value="txt">純文字 (.txt)</option>
                </select>
            </div>
        </div>
        <button class="dl-btn" style="width: auto; padding: 10px 25px;" onclick="openExportModal()">📦 打包選取區域為 ZIP</button>
    </div>

    <!-- 區域清單 -->
    <div class="list-header-bar">
        <h2 style="margin: 0; border: none; font-size: 1.3rem; color: #2E5A44;">📋 區域清單與微調</h2>
        <button class="add-area-btn" onclick="addEmptyCluster()">➕ 新增空白區域</button>
    </div>
    <div id="resultArea" class="results-grid"></div>
</div>

<!-- ================= 模態視窗：匯入處理中心 ================= -->
<div class="modal-overlay" id="importModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 style="margin: 0; border: none; padding: 0;">📥 匯入處理中心</h2>
            <button onclick="closeImportModal()" style="background: none; border: none; color: #999; font-size: 24px; cursor: pointer;">✖</button>
        </div>
        <div class="modal-body">
            <h3 style="color:#d35400; margin-top:0;">成功解析 <span id="importFileCount" style="font-size:24px;">0</span> 個檔案，共 <span id="importTotalCount" style="font-size:24px;">0</span> 筆座標</h3>
            <p style="font-size:14px; color:#555;">請選擇這批新座標的處理方式（絕不會影響您現有的其他區域）：</p>
            
            <div class="import-option" onclick="document.getElementById('optSeparate').checked=true; toggleImportSub(false);">
                <label><input type="radio" name="importMode" id="optSeparate" value="separate" checked> <b>選項 A：依檔案建立獨立區域</b> (推薦：1 個檔案 = 1 個專屬區域)</label>
            </div>
            
            <div class="import-option" onclick="document.getElementById('optMerge').checked=true; toggleImportSub(false);">
                <label><input type="radio" name="importMode" id="optMerge" value="merge"> <b>選項 B：合併為單一區域</b> (將所有新座標包成 1 個新區域)</label>
            </div>
            
            <div class="import-option" onclick="document.getElementById('optAi').checked=true; toggleImportSub(true);">
                <label><input type="radio" name="importMode" id="optAi" value="ai"> <b>選項 C：僅針對這批新座標進行 AI 獨立打散分區</b></label>
                
                <div class="import-sub-box" id="importAiSettings">
                    <div style="margin-bottom: 10px;">
                        <label style="font-weight:normal; margin-bottom:5px;"><input type="radio" name="importAiType" value="limit" checked> <b>模式一：</b>依照數量限制分區</label>
                        <div style="display:flex; gap:10px; margin-left:25px;">
                            <input type="number" id="impMin" placeholder="下限(如:10)" value="10" style="width:100px;">
                            <input type="number" id="impMax" placeholder="上限(如:20)" value="20" style="width:100px;">
                        </div>
                    </div>
                    <div>
                        <label style="font-weight:normal; margin-bottom:5px;"><input type="radio" name="importAiType" value="fixed"> <b>模式二：</b>指定切成特定區數</label>
                        <div style="margin-left:25px;">
                            <input type="number" id="impFixedN" placeholder="平分成幾區?" style="width:150px;">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="outline-btn" style="width: auto; background: #fff;" onclick="closeImportModal()">取消</button>
            <button class="dl-btn" style="width: auto; padding: 10px 20px; font-size: 14px;" onclick="executeImport()">✅ 確認執行</button>
        </div>
    </div>
</div>

<!-- ================= 模態視窗：匯出確認 ================= -->
<div class="modal-overlay" id="exportModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 style="margin: 0; border: none; padding: 0;">📝 匯出 ZIP 檔名前最後確認</h2>
            <button onclick="closeExportModal()" style="background: none; border: none; color: #999; font-size: 24px; cursor: pointer;">✖</button>
        </div>
        <div class="modal-body">
            <p style="font-size: 13px; color: #777; margin-top: 0;">請為即將打包的區域設定完整檔名（不需填寫副檔名）。<br>※ 空區域不會被匯出。</p>
            <table class="export-table">
                <thead>
                    <tr><th style="width:40px;"></th><th style="width:120px;">目前簡稱</th><th>完整匯出檔名</th><th style="width:60px;">點數</th></tr>
                </thead>
                <tbody id="exportTableBody"></tbody>
            </table>
        </div>
        <div class="modal-footer">
            <button class="outline-btn" style="width: auto; background: #fff;" onclick="closeExportModal()">取消</button>
            <button class="dl-btn" style="width: auto; padding: 10px 20px; font-size: 14px;" onclick="generateZIP()">💾 下載 ZIP</button>
        </div>
    </div>
</div>

<script>
    // 使用柔和大地與自然色系替換原本刺眼的顏色
    const themeColors = ['#D36B5B', '#5A8896', '#6C9A69', '#D9A05B', '#966B8E', '#C28455', '#4A5B63', '#A67358', '#509A8F', '#B36D82'];
    const themeIcons = ['🔴', '🔵', '🟢', '🟡', '🟣', '🟠', '⚫', '🟤', '🔷', '🌸'];

    let allPoints = [];
    let clustersMeta = []; 
    let pointIdCounter = 0;
    let clusterIdCounter = 0;
    
    let tempImportFiles = []; 

    let map = L.map('map').setView([23.5, 121], 7);
    let markerLayers = L.layerGroup().addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    dropZone.addEventListener('click', () => fileInput.click());
    
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => { document.body.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }); dropZone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }); });
    dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => processFilesAsync(e.dataTransfer.files));
    fileInput.addEventListener('change', e => processFilesAsync(e.target.files));

    async function processFilesAsync(files) {
        dropZone.classList.remove('dragover');
        tempImportFiles = [];
        let totalPts = 0;
        
        for (let file of Array.from(files)) {
            let text = await file.text();
            let ext = file.name.split('.').pop().toLowerCase();
            let parsed = (ext === 'gpx') ? parseGPXRaw(text) : parseTextRaw(text);
            
            if (parsed.length > 0) {
                tempImportFiles.push({ fileName: file.name.replace(`.${ext}`, ''), points: parsed });
                totalPts += parsed.length;
            }
        }
        
        fileInput.value = '';
        if (tempImportFiles.length > 0) {
            openImportModal(totalPts);
        } else {
            alert("在檔案中未找到有效座標！");
        }
    }

    function processManualPoints() {
        const text = document.getElementById('manualInput').value;
        if (!text.trim()) return;
        let parsed = parseTextRaw(text);
        if (parsed.length > 0) {
            tempImportFiles = [{ fileName: `自訂匯入區_${clusterIdCounter + 1}`, points: parsed }];
            document.getElementById('manualInput').value = '';
            openImportModal(parsed.length);
        } else { 
            alert("未識別到有效座標 (需包含 緯度,經度)！"); 
        }
    }

    function parseGPXRaw(xmlText) {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        let pts = [];
        let nodes = xmlDoc.getElementsByTagName('wpt');
        if (nodes.length === 0) nodes = xmlDoc.getElementsByTagName('trkpt');
        Array.from(nodes).forEach((node, idx) => {
            const lat = parseFloat(node.getAttribute('lat'));
            const lon = parseFloat(node.getAttribute('lon'));
            let nameTag = node.getElementsByTagName('name')[0];
            let ptName = nameTag ? nameTag.textContent : `匯入_${String(idx+1).padStart(3,'0')}`;
            if (!isNaN(lat) && !isNaN(lon)) pts.push({ lat, lng: lon, name: ptName });
        });
        return pts;
    }

    function parseTextRaw(text) {
        let pts = [];
        text.split(/\r?\n/).forEach((line, idx) => {
            const match = line.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
            if (match) pts.push({ lat: parseFloat(match[1]), lng: parseFloat(match[2]), name: `手動新增_${String(idx+1).padStart(3,'0')}` });
        });
        return pts;
    }

    function openImportModal(totalPts) {
        document.getElementById('importFileCount').innerText = tempImportFiles.length;
        document.getElementById('importTotalCount').innerText = totalPts;
        document.getElementById('optSeparate').checked = true;
        toggleImportSub(false);
        document.getElementById('importModal').style.display = 'flex';
    }
    
    function closeImportModal() { document.getElementById('importModal').style.display = 'none'; tempImportFiles = []; }
    function toggleImportSub(show) { document.getElementById('importAiSettings').style.display = show ? 'block' : 'none'; }

    function executeImport() {
        let mode = document.querySelector('input[name="importMode"]:checked').value;
        let assignedPts = [];
        let allImportedPts = tempImportFiles.flatMap(fileObj => fileObj.points);
        let N = allImportedPts.length;

        if (mode === 'separate') {
            tempImportFiles.forEach(fileObj => {
                let cId = createNewCluster(fileObj.fileName);
                fileObj.points.forEach(p => { 
                    assignedPts.push({ id: pointIdCounter++, lat: p.lat, lng: p.lng, name: p.name, clusterId: cId }); 
                });
            });
        } else if (mode === 'merge') {
            let mergedName = tempImportFiles.length === 1 ? tempImportFiles[0].fileName : `合併匯入區_${clusterIdCounter + 1}`;
            let cId = createNewCluster(mergedName);
            allImportedPts.forEach(p => { 
                assignedPts.push({ id: pointIdCounter++, lat: p.lat, lng: p.lng, name: p.name, clusterId: cId }); 
            });
        } else if (mode === 'ai') {
            let aiType = document.querySelector('input[name="importAiType"]:checked').value;
            let totalGroups = 1;
            
            if (aiType === 'limit') {
                let min = parseInt(document.getElementById('impMin').value);
                let max = parseInt(document.getElementById('impMax').value);
                if (min > max || min < 1) return alert("上下限設定錯誤！");
                totalGroups = Math.ceil(N / max);
                if (totalGroups > Math.floor(N / min)) return alert("數量衝突，無法完美分配！請調整上下限。");
            } else {
                totalGroups = parseInt(document.getElementById('impFixedN').value);
                if (!totalGroups || totalGroups < 1 || totalGroups > N) return alert("區塊數設定錯誤！");
            }

            let newClusterIds = [];
            for(let i=0; i<totalGroups; i++) newClusterIds.push(createNewCluster(`AI匯入分區_${clusterIdCounter + 1}`));
            
            let capacities = Array(totalGroups).fill(Math.floor(N / totalGroups));
            for (let i = 0; i < N % totalGroups; i++) capacities[i]++;
            let centroids = [...allImportedPts].sort(() => 0.5 - Math.random()).slice(0, totalGroups);

            for (let iter = 0; iter < 30; iter++) {
                let currentCounts = Array(totalGroups).fill(0);
                let assigned = Array(N).fill(false);
                let distances = [];
                for (let i = 0; i < N; i++) {
                    for (let c = 0; c < totalGroups; c++) distances.push({ pIdx: i, cIdx: c, dist: Math.pow(allImportedPts[i].lat - centroids[c].lat, 2) + Math.pow(allImportedPts[i].lng - centroids[c].lng, 2) });
                }
                distances.sort((a, b) => a.dist - b.dist);
                
                let tempResults = Array(N).fill(0);
                distances.forEach(item => {
                    if (!assigned[item.pIdx] && currentCounts[item.cIdx] < capacities[item.cIdx]) {
                        assigned[item.pIdx] = true; currentCounts[item.cIdx]++;
                        tempResults[item.pIdx] = newClusterIds[item.cIdx];
                    }
                });
                
                let sumsLat = Array(totalGroups).fill(0), sumsLng = Array(totalGroups).fill(0);
                for(let i=0; i<N; i++) {
                    let idx = newClusterIds.indexOf(tempResults[i]);
                    sumsLat[idx] += allImportedPts[i].lat; sumsLng[idx] += allImportedPts[i].lng;
                }
                for(let c=0; c<totalGroups; c++) if(currentCounts[c]>0) centroids[c] = { lat: sumsLat[c]/currentCounts[c], lng: sumsLng[c]/currentCounts[c] };
                
                if (iter === 29) {
                    allImportedPts.forEach((p, i) => { assignedPts.push({ id: pointIdCounter++, lat: p.lat, lng: p.lng, name: p.name, clusterId: tempResults[i] }); });
                }
            }
        }

        allPoints = allPoints.concat(assignedPts);
        closeImportModal();
        updateSystem();
        alert(`成功匯入並分配了 ${assignedPts.length} 筆座標！`);
    }

    window.syncClusterText = function(cId) {
        let textarea = document.getElementById(`txt-${cId}`);
        let newPts = parseTextRaw(textarea.value);
        let currentPts = allPoints.filter(p => p.clusterId === cId);
        
        let currentMap = new Map();
        currentPts.forEach(p => {
            let key = `${p.lat},${p.lng}`;
            if(!currentMap.has(key)) currentMap.set(key, []);
            currentMap.get(key).push(p);
        });

        let newMap = new Map();
        newPts.forEach(p => {
            let key = `${p.lat},${p.lng}`;
            newMap.set(key, (newMap.get(key) || 0) + 1);
        });

        let addedCount = 0, removedCount = 0;
        let meta = clustersMeta.find(m => m.id === cId);
        let originalName = meta ? meta.shortName : "未知";

        currentMap.forEach((ptsArr, key) => {
            let cCount = ptsArr.length;
            let nCount = newMap.get(key) || 0;
            if (cCount > nCount) {
                let toRemove = cCount - nCount;
                for(let i=0; i<toRemove; i++) {
                    let p = ptsArr[i];
                    removedCount++;
                    if (cId === -1) {
                        allPoints = allPoints.filter(ap => ap.id !== p.id); 
                    } else {
                        p.clusterId = -1; 
                        p.name = `座標_原_${originalName}`;
                    }
                }
            }
        });

        newMap.forEach((nCount, key) => {
            let cCount = currentMap.has(key) ? currentMap.get(key).length : 0;
            if (nCount > cCount) {
                let toAdd = nCount - cCount;
                let [lat, lng] = key.split(',').map(Number);
                for(let i=0; i<toAdd; i++) {
                    addedCount++;
                    allPoints.push({ id: pointIdCounter++, lat: lat, lng: lng, name: '文字框補充', clusterId: cId });
                }
            }
        });

        updateSystem();
        if (addedCount > 0 || removedCount > 0) alert(`座標同步完成！\n✔️ 新增 ${addedCount} 筆\n❌ 刪除/移出 ${removedCount} 筆`);
    };

    window.addEmptyCluster = () => { createNewCluster(`手動新增區_${clusterIdCounter + 1}`); updateSystem(); };
    function createNewCluster(defaultName) {
        let id = clusterIdCounter++;
        clustersMeta.push({ id: id, shortName: defaultName, finalName: defaultName, selected: true, color: themeColors[clustersMeta.length % 10], icon: themeIcons[clustersMeta.length % 10] });
        return id;
    }
    window.deleteCluster = (id) => {
        if(confirm("確定刪除此區？\n內部點位將被退回至「不使用(已排除)」區。")) {
            let meta = clustersMeta.find(m => m.id === id);
            allPoints.forEach(p => { if(p.clusterId === id) { p.clusterId = -1; p.name = `座標_原_${meta.shortName}`; } });
            clustersMeta = clustersMeta.filter(c => c.id !== id);
            clustersMeta.forEach((m, i) => { m.color = themeColors[i % 10]; m.icon = themeIcons[i % 10]; });
            updateSystem();
        }
    };
    
    function updateSystem() {
        document.getElementById('totalPointsCount').innerText = allPoints.filter(p => p.clusterId >= 0).length;
        document.getElementById('totalClustersCount').innerText = clustersMeta.length;
        markerLayers.clearLayers();
        const resultArea = document.getElementById('resultArea');
        resultArea.innerHTML = '';
        let bounds = [];

        clustersMeta.forEach(meta => {
            let pts = allPoints.filter(p => p.clusterId === meta.id);
            renderCard(pts, meta, false);
            pts.forEach(p => bounds.push([p.lat, p.lng]));
        });

        let unusedPoints = allPoints.filter(p => p.clusterId === -1);
        if (unusedPoints.length > 0) renderCard(unusedPoints, { id: -1, shortName: '不使用 (已排除)', color: '#bdc3c7', icon: '⚪' }, true);
        if (bounds.length > 0) map.fitBounds(L.latLngBounds(bounds).pad(0.1));
    }

    function renderCard(points, meta, isUnused) {
        const container = document.getElementById('resultArea');
        const latlngList = points.map(p => `${p.lat}, ${p.lng}`).join('\n');
        let headerHtml = '';
        
        if (isUnused) {
            headerHtml = `<h3 style="margin:0; font-size:15px; color:#7f8c8d;">${meta.icon} ${meta.shortName} <span class="badge" style="background:#fff;">${points.length} 點</span></h3>
                          <div style="font-size:11px; color:#d35400; margin-top:3px;">※ 於下方刪除並更新將徹底抹除座標</div>`;
        } else {
            let chk = meta.selected ? "checked" : "";
            headerHtml = `
                <div class="card-header">
                    <input type="checkbox" onchange="clustersMeta.find(m=>m.id==${meta.id}).selected=this.checked" ${chk}>
                    <span>${meta.icon}</span>
                    <input type="text" class="card-title-input" style="color:${meta.color};" value="${meta.shortName}" onchange="let m=clustersMeta.find(c=>c.id==${meta.id}); m.shortName=this.value; m.finalName=this.value;">
                    <span class="badge" style="background:${points.length===0?'#Fceceb':'#FDFBF7'};">${points.length} 點</span>
                    <div style="margin-left:auto; display:flex; gap:1px;">
                        <button onclick="moveClusterUp(${meta.id})" style="background:none; border:none; cursor:pointer;" title="往前">⬆️</button>
                        <button onclick="moveClusterDown(${meta.id})" style="background:none; border:none; cursor:pointer;" title="往後">⬇️</button>
                        <button onclick="deleteCluster(${meta.id})" style="background:none; border:none; cursor:pointer;" title="刪除">🗑️</button>
                    </div>
                </div>`;
        }

        const card = document.createElement('div');
        card.className = isUnused ? "cluster-card card-gray" : "cluster-card";
        card.style.borderColor = meta.color;
        card.innerHTML = `
            ${headerHtml}
            <textarea id="txt-${meta.id}" placeholder="可直接貼上/刪除座標...">${latlngList}</textarea>
            <button class="outline-btn" style="margin-top:8px; padding:6px; font-size:13px; width:100%; border-color:#D2B48C; color:#555; background: #fff;" onclick="syncClusterText(${meta.id})">💾 儲存並同步座標變更</button>
        `;
        container.appendChild(card);

        points.forEach(p => {
            let popupHtml = `<div style="font-size:13px;"><b>🔖 名稱：</b> ${p.name}<br><b>📍 座標：</b> ${p.lat}, ${p.lng}<hr style="margin:5px 0; border-color:#E6F0EA;"><b>移動至：</b><select class="popup-select" onchange="let pt=allPoints.find(x=>x.id==${p.id}); pt.clusterId=parseInt(this.value); updateSystem();">`;
            clustersMeta.forEach(m => { popupHtml += `<option value="${m.id}" ${m.id===p.clusterId?'selected':''}>${m.icon} ${m.shortName}</option>`; });
            popupHtml += `<option value="-1" ${p.clusterId===-1?'selected':''}>⚪ 不使用 (排除)</option></select></div>`;
            L.circleMarker([p.lat, p.lng], { radius: 7, fillColor: meta.color, color: "#fff", weight: 2, fillOpacity: 0.9 }).bindPopup(popupHtml).addTo(markerLayers);
        });
    }

    window.toggleAllCheckboxes = (s) => { clustersMeta.forEach(m => m.selected = s); updateSystem(); };
    window.moveClusterUp = (id) => { let idx = clustersMeta.findIndex(c => c.id === id); if (idx > 0) { [clustersMeta[idx], clustersMeta[idx-1]] = [clustersMeta[idx-1], clustersMeta[idx]]; clustersMeta.forEach((m, i) => { m.color = themeColors[i % 10]; m.icon = themeIcons[i % 10]; }); updateSystem(); } };
    window.moveClusterDown = (id) => { let idx = clustersMeta.findIndex(c => c.id === id); if (idx < clustersMeta.length - 1 && idx !== -1) { [clustersMeta[idx], clustersMeta[idx+1]] = [clustersMeta[idx+1], clustersMeta[idx]]; clustersMeta.forEach((m, i) => { m.color = themeColors[i % 10]; m.icon = themeIcons[i % 10]; }); updateSystem(); } };

    window.startConstrainedKMeansGlobal = () => {
        let activePoints = allPoints.filter(p => p.clusterId !== -1);
        if (activePoints.length === 0) return alert("沒有點位！");
        if (!confirm("⚠️ 警告：這將會打散目前所有的區域設定並由 AI 重新分配，確定執行？")) return;
        
        const min = parseInt(document.getElementById('minSize').value);
        const max = parseInt(document.getElementById('maxSize').value);
        let N = activePoints.length;
        let totalGroups = Math.ceil(N / max);
        if (min > max || totalGroups > Math.floor(N / min)) return alert("數量限制衝突，無法完美分配！");

        clustersMeta = []; clusterIdCounter = 0;
        for(let i=0; i<totalGroups; i++) createNewCluster(`全局分配區_${i+1}`);
        let capacities = Array(totalGroups).fill(Math.floor(N / totalGroups));
        for (let i = 0; i < N % totalGroups; i++) capacities[i]++;
        
        let centroids = [...activePoints].sort(() => 0.5 - Math.random()).slice(0, totalGroups);
        for (let iter = 0; iter < 30; iter++) {
            let currentCounts = Array(totalGroups).fill(0), assigned = Array(N).fill(false), distances = [];
            for (let i=0; i<N; i++) for (let c=0; c<totalGroups; c++) distances.push({ pIdx: i, cIdx: c, dist: Math.pow(activePoints[i].lat - centroids[c].lat, 2) + Math.pow(activePoints[i].lng - centroids[c].lng, 2) });
            distances.sort((a, b) => a.dist - b.dist);
            distances.forEach(item => { if (!assigned[item.pIdx] && currentCounts[item.cIdx] < capacities[item.cIdx]) { assigned[item.pIdx] = true; currentCounts[item.cIdx]++; activePoints[item.pIdx].clusterId = clustersMeta[item.cIdx].id; } });
            let sumsLat = Array(totalGroups).fill(0), sumsLng = Array(totalGroups).fill(0);
            activePoints.forEach(p => { sumsLat[p.clusterId] += p.lat; sumsLng[p.clusterId] += p.lng; });
            for(let c=0; c<totalGroups; c++) if(currentCounts[c]>0) centroids[c] = { lat: sumsLat[c]/currentCounts[c], lng: sumsLng[c]/currentCounts[c] };
        }
        updateSystem();
    };

    window.openExportModal = () => {
        let toExport = clustersMeta.filter(m => m.selected && allPoints.some(p => p.clusterId === m.id));
        if (toExport.length === 0) return alert("請勾選至少一個有座標的區域！");
        let tbody = document.getElementById('exportTableBody');
        tbody.innerHTML = toExport.map(m => `<tr><td>${m.icon}</td><td style="color:#555;font-size:13px;">${m.shortName}</td><td><input type="text" value="${m.finalName}" onchange="clustersMeta.find(c=>c.id==${m.id}).finalName=this.value"></td><td>${allPoints.filter(p=>p.clusterId===m.id).length}</td></tr>`).join('');
        document.getElementById('exportModal').style.display = 'flex';
    };
    window.closeExportModal = () => document.getElementById('exportModal').style.display = 'none';
    
    window.generateZIP = () => {
        const zip = new JSZip();
        const format = document.getElementById('exportFormat').value;
        clustersMeta.filter(m => m.selected).forEach(meta => {
            let pts = allPoints.filter(p => p.clusterId === meta.id);
            if (pts.length === 0) return;
            let sName = meta.finalName.replace(/[\\/:*?"<>|]/g, "_"); 
            if (format === 'txt') {
                zip.file(`${sName}.txt`, pts.map(p => `${p.lat}, ${p.lng}`).join('\n'));
            } else {
                let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" xmlns="http://www.topografix.com/GPX/1/1">\n` + pts.map(p => `  <wpt lat="${p.lat}" lon="${p.lng}"><name>${p.name}</name></wpt>\n`).join('') + `</gpx>`;
                zip.file(`${sName}.wpt`, gpx);
            }
        });
        zip.generateAsync({ type: "blob" }).then(content => {
            let a = document.createElement('a'); a.href = URL.createObjectURL(content);
            a.download = `花田座標打包_${new Date().toISOString().slice(0,10).replace(/-/g,"")}.zip`;
            a.click(); URL.revokeObjectURL(a.href); closeExportModal();
        });
    };
</script>
